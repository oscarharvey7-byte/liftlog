<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LiftLog" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>LiftLog — Mobile Gym Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f0f2f7;
  --text: #10131a;
  --muted: #7c8494;
  --line: #e5e8ef;
  --blue: #1687ff;
  --blue-dark: #0a70df;
  --blue-soft: #eaf4ff;
  --green: #19a66a;
  --green-soft: #eaf8f2;
  --gold: #ffbe0b;
  --gold-soft: #fff6d8;
  --red: #e65353;
  --shadow: 0 16px 40px rgba(20, 37, 63, .10);
  --desktop-bg: #e9edf3;
  --danger-soft: #fff0f0;
  --notice-text: #275b8e;
  --gold-text: #8a6100;
  --chart-grid: #e8ebf1;
  --chart-label: #9aa1ad;
  --overlay: rgba(10,15,24,.28);
  --radius: 22px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d1015;
  --surface: #161b22;
  --surface-2: #202630;
  --text: #f4f7fb;
  --muted: #98a3b2;
  --line: #2b333f;
  --blue: #4da3ff;
  --blue-dark: #73b7ff;
  --blue-soft: #122b43;
  --green: #54d39a;
  --green-soft: #123226;
  --gold: #f8c54e;
  --gold-soft: #362f18;
  --gold-text: #f6d36d;
  --red: #ff7c83;
  --danger-soft: #351c20;
  --notice-text: #9dcbf4;
  --chart-grid: #2b333f;
  --chart-label: #8f9baa;
  --shadow: 0 18px 46px rgba(0, 0, 0, .30);
  --desktop-bg: #080a0e;
  --overlay: rgba(0,0,0,.58);
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid rgba(22, 135, 255, .25);
  outline-offset: 2px;
}

.app-shell { max-width: 900px; margin: 0 auto; min-height: 100vh; position: relative; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding: calc(14px + var(--safe-top)) 18px 12px;
  display: grid; grid-template-columns: 42px 1fr 42px; gap: 8px; align-items: center;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}
.topbar > div { grid-column: 2; }
.topbar .icon-btn:first-child { grid-column: 1; grid-row: 1; }
.topbar .icon-btn:last-child { grid-column: 3; grid-row: 1; }
.eyebrow { font-size: 10px; line-height: 1; color: var(--blue); font-weight: 800; letter-spacing: .12em; margin-bottom: 4px; }
h1 { font-size: 25px; line-height: 1.05; margin: 0; letter-spacing: -.03em; }
h2 { margin: 0; letter-spacing: -.025em; }
h3 { margin: 0; }
p { line-height: 1.45; }

.icon-btn {
  width: 42px; height: 42px; border: 0; border-radius: 14px; background: var(--surface);
  display: grid; place-items: center; color: var(--text); box-shadow: 0 3px 10px rgba(0,0,0,.04); cursor: pointer;
}
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active { transform: scale(.96); }
.hidden { visibility: hidden !important; pointer-events: none; }

.view { padding: 16px 16px calc(94px + var(--safe-bottom)); }
.section { margin-bottom: 20px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section-heading h2 { font-size: 20px; }
.section-heading p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.text-btn { border: 0; background: transparent; color: var(--blue); font-weight: 700; padding: 8px; cursor: pointer; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 7px 24px rgba(24,44,75,.045); }
.card.pad { padding: 16px; }
.hero-card { padding: 18px; overflow: hidden; position: relative; }
.hero-card::after { content:""; position:absolute; width:140px; height:140px; border-radius:50%; right:-60px; top:-70px; background: linear-gradient(145deg, rgba(22,135,255,.18), rgba(22,135,255,0)); }

.stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 15px; }
.stat { background: var(--surface-2); border-radius: 16px; padding: 11px; min-width:0; }
.stat .value { font-size: 20px; font-weight: 800; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .label { font-size: 11px; color: var(--muted); margin-top: 3px; }

.primary-btn, .secondary-btn, .danger-btn {
  border: 0; border-radius: 15px; min-height: 47px; padding: 0 16px; font-weight: 800; cursor: pointer;
}
.primary-btn { color: white; background: var(--blue); box-shadow: 0 8px 18px rgba(22,135,255,.22); }
.primary-btn:hover { background: var(--blue-dark); }
.secondary-btn { color: var(--text); background: var(--surface-2); }
.danger-btn { color:var(--red); background:var(--danger-soft); }
.full { width: 100%; }
.btn-row { display:flex; gap:10px; flex-wrap:wrap; }
.btn-row > * { flex: 1; }

.list { overflow: hidden; }
.list-row { display:flex; align-items:center; gap:12px; padding: 14px 15px; border-bottom: 1px solid var(--line); cursor:pointer; min-height: 64px; }
.list-row:last-child { border-bottom:0; }
.list-row:active { background: var(--surface-2); }
.list-main { min-width:0; flex:1; }
.list-title { font-weight: 760; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list-sub { color:var(--muted); font-size:12px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chev { color:#b1b7c3; font-size:24px; font-weight:300; }
.exercise-icon { width:42px; height:42px; border-radius:14px; background: var(--blue-soft); display:grid; place-items:center; font-weight:800; color:var(--blue); flex:0 0 auto; }

.badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; padding:6px 9px; border-radius:999px; }
.badge.blue { color:var(--blue-dark); background:var(--blue-soft); }
.badge.green { color:var(--green); background:var(--green-soft); }
.badge.gold { color:var(--gold-text); background:var(--gold-soft); }
.badge.gray { color:var(--muted); background:var(--surface-2); }

.workout-card { padding: 16px; margin-bottom: 10px; }
.workout-top { display:flex; align-items:flex-start; gap:10px; justify-content:space-between; }
.workout-top h3 { font-size:17px; }
.workout-meta { color:var(--muted); font-size:12px; margin-top:4px; }
.workout-exercises { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; }
.exercise-pill { background:var(--surface-2); border-radius:999px; padding:6px 9px; font-size:11px; color:var(--muted); }

.search-wrap { position:relative; margin-bottom:12px; }
.search-wrap svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:2; }
.search-input, .input, .select, .textarea {
  width:100%; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:15px; min-height:46px; padding: 0 13px;
}
.search-input { padding-left:40px; }
.textarea { padding:12px 13px; min-height:84px; resize:vertical; }
.label { display:block; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.03em; margin:0 0 6px 3px; text-transform:uppercase; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.field { margin-bottom:12px; }

.segmented { display:flex; gap:4px; background:var(--surface-2); border-radius:14px; padding:4px; overflow-x:auto; }
.segmented button { border:0; background:transparent; border-radius:11px; min-height:34px; padding:0 12px; color:var(--muted); font-size:12px; font-weight:750; white-space:nowrap; cursor:pointer; }
.segmented button.active { background:var(--surface); color:var(--blue); box-shadow:0 3px 8px rgba(0,0,0,.06); }

.chart-card { padding:15px; }
.chart-header { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.chart-value { font-size:28px; font-weight:850; letter-spacing:-.04em; }
.chart-date { color:var(--muted); font-size:12px; margin-top:2px; }
.chart-wrap { height:210px; margin-top:12px; position:relative; }
.chart-wrap svg { width:100%; height:100%; overflow:visible; }
.chart-gridline { stroke:var(--chart-grid); stroke-width:1; }
.chart-line { fill:none; stroke:var(--blue); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.chart-area { fill:url(#chartGrad); }
.chart-dot { fill:var(--blue); stroke:white; stroke-width:3; }
.chart-label { font-size:10px; fill:var(--chart-label); }
.empty-chart { height:100%; display:grid; place-items:center; color:var(--muted); text-align:center; padding:20px; }

.pr-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:9px; margin-top:11px; }
.pr-card { border:1px solid var(--line); border-radius:17px; padding:12px; background:var(--surface); }
.pr-card .pr-label { color:var(--muted); font-size:10px; text-transform:uppercase; font-weight:800; letter-spacing:.04em; }
.pr-card .pr-value { margin-top:5px; font-weight:850; font-size:18px; letter-spacing:-.025em; }
.pr-medal { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:var(--gold); color:white; font-weight:900; box-shadow:0 8px 20px rgba(255,190,11,.25); }

.history-set { display:grid; grid-template-columns:36px 1fr 1fr 38px; gap:7px; align-items:center; padding:7px 0; font-size:13px; }
.history-set .set-n { color:var(--muted); }
.history-set .set-val { background:var(--surface-2); border-radius:10px; padding:8px; text-align:center; }
.history-session { padding:14px 15px; border-bottom:1px solid var(--line); }
.history-session:last-child { border-bottom:0; }
.history-session-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:5px; }
.history-session-title { font-weight:800; }
.history-session-date { color:var(--muted); font-size:12px; }

.metric-strip { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.metric-card { padding:15px; }
.metric-card .number { font-size:26px; font-weight:850; letter-spacing:-.04em; }
.metric-card .caption { margin-top:4px; font-size:11px; color:var(--muted); }
.metric-card .delta { margin-top:7px; font-size:11px; font-weight:800; color:var(--green); }

.bar-row { display:grid; grid-template-columns:94px 1fr 32px; gap:9px; align-items:center; margin:11px 0; }
.bar-name { font-size:12px; color:#555e6c; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-track { height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
.bar-fill { height:100%; border-radius:99px; background:var(--blue); }
.bar-val { font-size:11px; color:var(--muted); text-align:right; }

.calendar-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:12px; }
.day-dot { min-width:0; text-align:center; }
.day-dot .dow { font-size:9px; color:var(--muted); text-transform:uppercase; }
.day-dot .circle { width:31px; height:31px; margin:5px auto 0; display:grid; place-items:center; border-radius:50%; background:var(--surface-2); font-size:11px; font-weight:750; }
.day-dot.done .circle { background:var(--blue); color:white; }
.day-dot.today .circle { outline:2px solid var(--blue); outline-offset:2px; }

.bottom-nav {
  position:fixed; left:50%; transform:translateX(-50%); bottom:0; z-index:30; width:min(900px,100%);
  display:grid; grid-template-columns:repeat(6,1fr); padding:7px 8px calc(7px + var(--safe-bottom));
  background:var(--surface); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); border-top:1px solid var(--line);
}
.nav-item { border:0; background:transparent; color:#8d95a2; min-height:55px; border-radius:13px; display:grid; place-items:center; align-content:center; gap:3px; cursor:pointer; }
.nav-item svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.nav-item span { font-size:10px; font-weight:750; }
.nav-item.active { color:var(--blue); }

.modal-backdrop { position:fixed; inset:0; z-index:100; background:rgba(10,15,24,.36); display:flex; align-items:flex-end; justify-content:center; padding-top:40px; }
.modal { width:min(700px,100%); max-height:92vh; overflow:auto; background:var(--bg); border-radius:26px 26px 0 0; box-shadow:0 -20px 60px rgba(0,0,0,.18); padding-bottom:calc(18px + var(--safe-bottom)); animation:sheetIn .22s ease-out; }
@keyframes sheetIn { from { transform:translateY(40px); opacity:.7; } to { transform:translateY(0); opacity:1; } }
.modal-head { position:sticky; top:0; z-index:4; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; background:rgba(246,247,251,.94); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
.modal-head h2 { font-size:19px; }
.modal-body { padding:14px 16px; }
.close-btn { width:36px; height:36px; border:0; border-radius:50%; background:#e7e9ee; color:#555d69; font-weight:900; cursor:pointer; }

.set-editor-card { padding:14px; margin-bottom:10px; }
.set-editor-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.set-editor-head h3 { font-size:16px; }
.set-editor-row { display:grid; grid-template-columns:30px 1fr 1fr 36px; gap:7px; align-items:center; margin-top:7px; }
.set-editor-row input { width:100%; min-width:0; border:1px solid var(--line); border-radius:11px; height:40px; padding:0 8px; text-align:center; background:var(--surface); }
.set-editor-row .setnum { text-align:center; font-size:12px; color:var(--muted); }
.mini-btn { width:36px; height:36px; border:0; border-radius:11px; background:var(--surface-2); color:var(--muted); cursor:pointer; }
.add-set { border:0; background:transparent; color:var(--blue); font-weight:800; padding:10px 0 2px; cursor:pointer; }

.fab { position:fixed; z-index:31; right:max(18px, calc((100vw - 900px)/2 + 18px)); bottom:calc(82px + var(--safe-bottom)); width:56px; height:56px; border:0; border-radius:18px; background:var(--blue); color:white; box-shadow:0 12px 30px rgba(22,135,255,.32); display:grid; place-items:center; cursor:pointer; }
.fab svg { width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; }

.toast { position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(88px + var(--safe-bottom)); z-index:200; background:#111722; color:white; border-radius:14px; padding:11px 14px; font-size:12px; font-weight:700; opacity:0; pointer-events:none; transition:.18s ease; box-shadow:var(--shadow); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.notice { padding:12px 13px; background:var(--blue-soft); color:var(--notice-text); border-radius:15px; font-size:12px; line-height:1.45; }
.divider { height:1px; background:var(--line); margin:14px 0; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.tiny { font-size:10px; }
.spacer-8 { height:8px; }
.spacer-12 { height:12px; }
.empty-state { text-align:center; padding:30px 18px; }
.empty-state .emoji { font-size:34px; }
.empty-state h3 { margin-top:8px; }
.empty-state p { color:var(--muted); font-size:13px; margin:7px auto 15px; max-width:330px; }

@media (min-width: 720px) {
  .view { padding-left:24px; padding-right:24px; }
  .desktop-two { display:grid; grid-template-columns:1.25fr .75fr; gap:14px; align-items:start; }
  .metric-strip { grid-template-columns:repeat(5,1fr); }
  .modal-backdrop { align-items:center; padding:30px; }
  .modal { border-radius:26px; max-height:88vh; }
}

@media (max-width: 380px) {
  .stat-grid { grid-template-columns:1fr 1fr; }
  .stat:last-child { grid-column:1 / -1; }
  .form-grid { grid-template-columns:1fr; }
  .chart-wrap { height:190px; }
}

/* ===== Mobile-first app layout (phone is the primary design target) ===== */
html { min-height: 100%; overscroll-behavior-y: none; }
body {
  min-height: 100dvh;
  overscroll-behavior-y: none;
  -webkit-text-size-adjust: 100%;
}

/* The product stays intentionally phone-sized, even on desktop. */
.app-shell {
  width: 100%;
  max-width: 480px;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
}

.topbar {
  min-height: 76px;
  padding: calc(10px + var(--safe-top)) 14px 10px;
  grid-template-columns: 46px minmax(0,1fr) 46px;
}
.topbar > div { min-width: 0; text-align: center; }
.eyebrow { font-size: 9px; margin-bottom: 3px; }
h1 {
  font-size: clamp(21px, 6vw, 25px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  width: 44px;
  height: 44px;
  border-radius: 15px;
  touch-action: manipulation;
}

.view {
  width: 100%;
  padding: 12px 12px calc(92px + var(--safe-bottom));
}
.section { margin-bottom: 16px; }
.section-heading { margin-bottom: 9px; align-items: center; }
.section-heading h2 { font-size: 18px; }
.section-heading p { font-size: 12px; }

.card { border-radius: 19px; box-shadow: 0 4px 18px rgba(24,44,75,.045); }
.card.pad, .workout-card, .chart-card { padding: 14px; }
.hero-card { padding: 16px; }
.hero-card h2 { font-size: 23px !important; }

/* 44px+ touch targets and iOS-friendly form font sizes. */
.primary-btn, .secondary-btn, .danger-btn,
.search-input, .input, .select, .textarea {
  min-height: 48px;
  font-size: 16px;
}
.primary-btn, .secondary-btn, .danger-btn,
.text-btn, .nav-item, .list-row, .segmented button, .mini-btn, .add-set {
  touch-action: manipulation;
}
.text-btn { min-height: 44px; }
.list-row { min-height: 68px; padding: 13px 14px; }
.exercise-icon { width: 44px; height: 44px; border-radius: 14px; }

.stat-grid { gap: 7px; }
.stat { padding: 10px 9px; border-radius: 14px; }
.stat .value { font-size: 18px; }
.metric-strip { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
.metric-card { padding: 13px; }
.metric-card .number { font-size: 23px; }

/* Tabs are intentionally thumb-scrollable on narrow screens. */
.segmented {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
}
.segmented::-webkit-scrollbar { display: none; }
.segmented button {
  flex: 0 0 auto;
  min-height: 38px;
  padding: 0 13px;
  scroll-snap-align: start;
}
#exerciseTabs button, #rangeSwitch button { flex: 1 0 auto; }

.chart-card { overflow: hidden; }
.chart-wrap { height: 200px; margin-top: 8px; }
.chart-value { font-size: 26px; }
.pr-grid { gap: 8px; }
.pr-card { padding: 11px; border-radius: 15px; }
.pr-card .pr-value { font-size: 17px; }

.history-set {
  grid-template-columns: 28px minmax(0,1fr) minmax(0,1fr) 42px;
  gap: 6px;
  font-size: 12px;
}
.history-set .set-val { padding: 8px 5px; }

/* A true mobile bottom tab bar, sized to the app rather than the desktop window. */
.bottom-nav {
  width: 100%;
  max-width: 480px;
  min-height: 72px;
  padding: 5px 6px calc(5px + var(--safe-bottom));
  box-shadow: 0 -8px 30px rgba(25,36,55,.05);
}
.nav-item { min-height: 58px; gap: 2px; }
.nav-item svg { width: 23px; height: 23px; }
.nav-item span { font-size: 10px; }

.fab {
  right: max(14px, calc((100vw - 480px)/2 + 14px));
  bottom: calc(82px + var(--safe-bottom));
  width: 58px;
  height: 58px;
  border-radius: 19px;
}
.toast {
  width: calc(100% - 28px);
  max-width: 420px;
  text-align: center;
  bottom: calc(86px + var(--safe-bottom));
}

/* Workout editing behaves like a native full-screen phone flow. */
.modal-backdrop {
  align-items: stretch;
  padding: 0;
  background: var(--overlay);
}
.modal {
  width: 100%;
  max-width: 480px;
  height: 100dvh;
  max-height: 100dvh;
  margin: 0 auto;
  border-radius: 0;
  padding-bottom: calc(16px + var(--safe-bottom));
  overscroll-behavior: contain;
}
.modal-head {
  min-height: calc(64px + var(--safe-top));
  padding: calc(10px + var(--safe-top)) 12px 10px;
}
.modal-head h2 { font-size: 18px; }
.modal-body { padding: 12px; }

  function bodyWeightChart(rows){
    if(rows.length<2) return '<div class="empty-state"><p>Add at least two entries to see your trend line.</p></div>';
    const W=600,H=220,pad={l:46,r:16,t:16,b:34};
    const vals=rows.map(r=>Number(r.weight));
    let min=Math.min(...vals),max=Math.max(...vals);
    const spread=Math.max(1,max-min);
    min-=spread*.2; max+=spread*.2;
    const x=i=>pad.l+(rows.length===1?0.5:i/(rows.length-1))*(W-pad.l-pad.r);
    const y=v=>pad.t+(max-v)*(H-pad.t-pad.b)/(max-min);
    const path=rows.map((r,i)=>`${i?'L':'M'} ${x(i).toFixed(1)} ${y(r.weight).toFixed(1)}`).join(' ');
    const grid=[0,.25,.5,.75,1].map(f=>{
      const v=max-(max-min)*f, yy=y(v);
      return `<line class="chart-gridline" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"/><text class="chart-label" x="4" y="${yy+4}">${fmtNum(v,1)}</text>`;
    }).join('');
    const labelIdx=[0,Math.floor((rows.length-1)/2),rows.length-1].filter((v,i,a)=>a.indexOf(v)===i);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight progress over time">
      ${grid}
      <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      ${rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.weight)}" r="4.5" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"><title>${fmtDate(r.date)}: ${fmtNum(r.weight,1)} kg</title></circle>`).join('')}
      ${labelIdx.map(i=>`<text class="chart-label" x="${x(i)}" y="${H-7}" text-anchor="${i===0?'start':i===rows.length-1?'end':'middle'}">${esc(fmtDate(rows[i].date))}</text>`).join('')}
    </svg>`;
  }

  function uid(prefix='id'){ return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`; }
  function esc(str=''){
    return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
  }
  function fmtNum(n, digits=1){
    if (!Number.isFinite(Number(n))) return '—';
    return Number(n).toLocaleString(undefined,{maximumFractionDigits:digits});
  }
  function localDate(dateStr){
    return new Date(`${dateStr}T12:00:00`);
  }
  function isoDate(d=new Date()){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function fmtDate(dateStr, opts={day:'numeric',month:'short'}){
    return localDate(dateStr).toLocaleDateString(undefined,opts);
  }
  function fmtLongDate(dateStr){ return fmtDate(dateStr,{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
  function startOfWeek(d = new Date()){
    const x = new Date(d); x.setHours(12,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x;
  }
  function daysBetween(a,b){ return Math.round((localDate(b)-localDate(a))/86400000); }
  function getExercise(id){ return data.exercises.find(e => e.id===id) || {id,name:'Unknown exercise',muscle:'Other',equipment:'Other'}; }
  function sessionVolume(entry){ return (entry.sets||[]).reduce((sum,s)=>sum+(Number(s.weight)||0)*(Number(s.reps)||0),0); }
  function workoutVolume(w){ return (w.exercises||[]).reduce((sum,e)=>sum+sessionVolume(e),0); }
  function totalSets(w){ return (w.exercises||[]).reduce((sum,e)=>sum+(e.sets||[]).length,0); }
  function e1rm(weight,reps){
    weight=Number(weight)||0; reps=Number(reps)||0;
    if (!weight || !reps) return 0;
    if (reps===1) return weight;
    return weight * (1 + reps/30); // Epley estimate
  }
  function bestSetScore(set){ return (Number(set.weight)||0)*(Number(set.reps)||0); }
  function exerciseHistory(exerciseId){
    return data.workouts
      .filter(w => (w.exercises||[]).some(e=>e.exerciseId===exerciseId))
      .map(w => ({workout:w, entry:w.exercises.find(e=>e.exerciseId===exerciseId)}))
      .sort((a,b)=>a.workout.date.localeCompare(b.workout.date));
  }
  function exerciseMetrics(exerciseId){
    const hist=exerciseHistory(exerciseId);
    const points=hist.map(({workout,entry})=>{
      const sets=entry.sets||[];
      const heaviest=Math.max(0,...sets.map(s=>Number(s.weight)||0));
      const best1rm=Math.max(0,...sets.map(s=>e1rm(s.weight,s.reps)));
      const bestSet=Math.max(0,...sets.map(bestSetScore));
      const volume=sessionVolume(entry);
      return {date:workout.date, workoutId:workout.id, heaviest, e1rm:best1rm, bestSet, volume, sets};
    });
    return {hist,points};
  }
  function getExercisePRs(exerciseId){
    const {points}=exerciseMetrics(exerciseId);
    const sets=points.flatMap(p=>p.sets.map(s=>({...s,date:p.date})))
      .filter(s=>Number(s.weight)>0 && Number(s.reps)>0);

    const heavy=sets.reduce((best,set)=>{
      if(!best) return set;
      const w=Number(set.weight)||0, bw=Number(best.weight)||0;
      const r=Number(set.reps)||0, br=Number(best.reps)||0;
      return w>bw || (w===bw && r>br) ? set : best;
    },null);

    const bestBy=(fn)=>sets.reduce((best,set)=>!best || fn(set)>fn(best)?set:best,null);
    const oneRm=bestBy(set=>e1rm(set.weight,set.reps));
    const bestSet=bestBy(set=>bestSetScore(set));
    const bestSession=points.reduce((b,p)=>!b||p.volume>b.volume?p:b,null);

    // Rep PRs are stored BY WEIGHT. Example: 12 kg x 10 beats 12 kg x 9.
    const repRecords={};
    sets.forEach(set=>{
      const weight=Number(set.weight)||0, reps=Number(set.reps)||0;
      if(!weight || !reps) return;
      const key=String(weight);
      if(!repRecords[key] || reps>repRecords[key].reps){
        repRecords[key]={weight,reps,date:set.date};
      }
    });

    return {heavy,oneRm,bestSet,bestSession,repRecords};
  }

  function exerciseSetTimeline(exerciseId){
    const rows=[];
    data.workouts.forEach((workout,workoutIndex)=>{
      const entry=(workout.exercises||[]).find(e=>e.exerciseId===exerciseId);
      if(!entry) return;
      (entry.sets||[]).forEach((set,setIndex)=>{
        const weight=Number(set.weight)||0, reps=Number(set.reps)||0;
        if(weight>0 && reps>0){
          rows.push({
            workoutId:workout.id,
            date:workout.date,
            workoutIndex,
            setIndex,
            weight,
            reps
          });
        }
      });
    });
    return rows.sort((a,b)=>
      a.date.localeCompare(b.date) ||
      a.workoutIndex-b.workoutIndex ||
      a.setIndex-b.setIndex
    );
  }

  function getSetPRInfo(exerciseId,workoutId,setIndex){
    const timeline=exerciseSetTimeline(exerciseId);
    const index=timeline.findIndex(row=>row.workoutId===workoutId && row.setIndex===Number(setIndex));
    if(index<0) return {weightPR:false,repPR:false};

    const current=timeline[index];
    const previous=timeline.slice(0,index);
    const previousMaxWeight=Math.max(0,...previous.map(row=>row.weight));
    const previousAtWeight=previous.filter(row=>row.weight===current.weight);
    const previousMaxRepsAtWeight=Math.max(0,...previousAtWeight.map(row=>row.reps));

    return {
      weightPR: current.weight>previousMaxWeight,
      repPR: previousAtWeight.length>0 && current.reps>previousMaxRepsAtWeight
    };
  }

  function prBadgeHTML(info){
    const badges=[];
    if(info?.weightPR) badges.push('<span class="badge gold pr-badge">Weight PR</span>');
    if(info?.repPR) badges.push('<span class="badge blue pr-badge">Rep PR</span>');
    return badges.length ? `<div class="pr-badges">${badges.join('')}</div>` : '';
  }

  function previousExercisePerformance(exerciseId,beforeDate=workoutDraft?.date,excludeWorkoutId=workoutDraft?.id){
    const history=exerciseHistory(exerciseId)
      .filter(({workout})=>workout.id!==excludeWorkoutId && (!beforeDate || workout.date<=beforeDate));
    const latest=history.at(-1);
    if(!latest) return null;

    const sets=(latest.entry.sets||[])
      .map(set=>({weight:Number(set.weight)||0,reps:Number(set.reps)||0}))
      .filter(set=>set.weight>0 && set.reps>0);
    if(!sets.length) return null;

    const best=sets.reduce((best,set)=>
      !best || set.weight>best.weight || (set.weight===best.weight && set.reps>best.reps) ? set : best
    ,null);

    return {weight:best.weight,reps:best.reps,date:latest.workout.date};
  }

  function previousPerformanceHTML(exerciseId){
    const previous=previousExercisePerformance(exerciseId);
    return previous
      ? `<div class="previous-performance"><span>Previous</span><strong>${fmtNum(previous.weight)} ${settings.unit} × ${fmtNum(previous.reps,0)} reps</strong><span>· ${fmtDate(previous.date)}</span></div>`
      : `<div class="previous-performance"><span>No previous sets logged</span></div>`;
  }

  function normalizeExerciseName(name=''){ return String(name).trim().toLowerCase().replace(/\s+/g,' '); }

  function personalRankInfo(exerciseId){
    const pts=exerciseMetrics(exerciseId).points;
    if(!pts.length) return {name:'Bronze',pct:0,sessions:0,next:'Silver',nextPct:2,nextSessions:3,progress:0};
    const baseline=Number(pts[0].e1rm)||0;
    const best=Math.max(...pts.map(p=>Number(p.e1rm)||0));
    const pct=baseline>0?Math.max(0,(best/baseline-1)*100):0;
    const sessions=pts.length;
    let name='Bronze', next='Silver', nextPct=2, nextSessions=3;
    if(sessions>=12 && pct>=15){name='Diamond';next='Diamond';nextPct=15;nextSessions=12;}
    else if(sessions>=8 && pct>=10){name='Platinum';next='Diamond';nextPct=15;nextSessions=12;}
    else if(sessions>=5 && pct>=5){name='Gold';next='Platinum';nextPct=10;nextSessions=8;}
    else if(sessions>=3 && pct>=2){name='Silver';next='Gold';nextPct=5;nextSessions=5;}
    const progress=name==='Diamond'?100:Math.min(100,Math.min(pct/nextPct,sessions/nextSessions)*100);
    return {name,pct,sessions,next,nextPct,nextSessions,progress};
  }
  function rankEmoji(name){ return ({Bronze:'🥉',Silver:'🥈',Gold:'🥇',Platinum:'💠',Diamond:'💎'})[name]||'🥉'; }
  function rankClass(name){ return `rank-${String(name).toLowerCase()}`; }
  function workoutCountSince(days){
    const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days); cutoff.setHours(0,0,0,0);
    return data.workouts.filter(w=>localDate(w.date)>=cutoff).length;
  }
  function weekActivity(){
    const start=startOfWeek(new Date());
    return Array.from({length:7},(_,i)=>{
      const d=new Date(start); d.setDate(start.getDate()+i);
      const date=isoDate(d);
      return {date, d, done:data.workouts.some(w=>w.date===date), today:date===isoDate(new Date())};
    });
  }
  function uniqueWorkoutDates(){ return [...new Set(data.workouts.map(w=>w.date))].sort(); }
  function consistencyStreak(){
    const weeks = new Map();
    data.workouts.forEach(w=>{
      const s=isoDate(startOfWeek(localDate(w.date)));
      weeks.set(s,(weeks.get(s)||0)+1);
    });
    const current=startOfWeek(new Date());
    let count=0;
    for(let i=0;i<52;i++){
      const d=new Date(current); d.setDate(current.getDate()-7*i);
      const key=isoDate(d);
      if ((weeks.get(key)||0)>0) count++;
      else if(i===0) continue;
      else break;
    }
    return count;
  }
  function recentPRCount(days=30){
    const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-days); cutoff.setHours(0,0,0,0);
    let count=0;
    data.exercises.forEach(exercise=>{
      exerciseSetTimeline(exercise.id).forEach(row=>{
        if(localDate(row.date)<cutoff) return;
        const info=getSetPRInfo(exercise.id,row.workoutId,row.setIndex);
        if(info.weightPR) count++;
        if(info.repPR) count++;
      });
    });
    return count;
  }

  function weeklyVolumeSeries(n=10){
    const current=startOfWeek(new Date());
    const arr=[];
    for(let i=n-1;i>=0;i--){
      const s=new Date(current); s.setDate(current.getDate()-7*i);
      const e=new Date(s); e.setDate(s.getDate()+6);
      const value=data.workouts.filter(w=>{const d=localDate(w.date);return d>=s&&d<=e;}).reduce((sum,w)=>sum+workoutVolume(w),0);
      arr.push({date:isoDate(s),value,label:s.toLocaleDateString(undefined,{day:'numeric',month:'short'})});
    }
    return arr;
  }
  function getTopImprovers(){
    return data.exercises.map(ex=>{
      const pts=exerciseMetrics(ex.id).points.filter(p=>p.heaviest>0);
      if(pts.length<2) return null;
      return {id:ex.id,name:ex.name,first:pts[0].heaviest,last:pts.at(-1).heaviest,delta:pts.at(-1).heaviest-pts[0].heaviest};
    }).filter(Boolean).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  }

  function lineChart(points,key){
    if(!points || !points.length) return `<div class="empty-chart"><div><strong>No graph data yet</strong><br><span class="small">Log this exercise on a workout to start the line.</span></div></div>`;
    const clean=points.map((p,i)=>({value:Number(p[key])||0,date:p.date,label:p.label||fmtDate(p.date),i}));
    if(!clean.some(p=>p.value>0)) return `<div class="empty-chart"><div><strong>No values for this metric yet</strong></div></div>`;
    const W=600,H=200,pad={l:38,r:10,t:12,b:28};
    const vals=clean.map(p=>p.value); let min=Math.min(...vals), max=Math.max(...vals);
    if(min===max){min=Math.max(0,min*.85);max=max*1.15||1;} else {const margin=(max-min)*.16;min=Math.max(0,min-margin);max+=margin;}
    const x=i=>clean.length===1?(W-pad.l-pad.r)/2+pad.l:pad.l+i*(W-pad.l-pad.r)/(clean.length-1);
    const y=v=>pad.t+(max-v)*(H-pad.t-pad.b)/(max-min);
    const path=clean.map((p,i)=>`${i?'L':'M'} ${x(i).toFixed(1)} ${y(p.value).toFixed(1)}`).join(' ');
    const area=`${path} L ${x(clean.length-1).toFixed(1)} ${H-pad.b} L ${x(0).toFixed(1)} ${H-pad.b} Z`;
    const ticks=4;
    const grid=Array.from({length:ticks},(_,i)=>{const v=min+(max-min)*(ticks-1-i)/(ticks-1);const yy=y(v);return `<line class="chart-gridline" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"/><text class="chart-label" x="0" y="${yy+3}">${fmtNum(v,0)}</text>`;}).join('');
    const labelIdx=[0,Math.floor((clean.length-1)/2),clean.length-1].filter((v,i,a)=>a.indexOf(v)===i);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress line chart"><defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--blue)" stop-opacity=".18"/><stop offset="1" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>${grid}<path class="chart-area" d="${area}"/><path class="chart-line" d="${path}"/>${clean.map((p,i)=>`<circle class="chart-dot" cx="${x(i)}" cy="${y(p.value)}" r="5"><title>${esc(p.label)}: ${fmtNum(p.value,1)}</title></circle>`).join('')}${labelIdx.map(i=>`<text class="chart-label" text-anchor="${i===0?'start':i===clean.length-1?'end':'middle'}" x="${x(i)}" y="${H-5}">${esc(clean[i].label)}</text>`).join('')}</svg>`;
  }

  async function loadFriendComparison(normalized){
    const box=document.getElementById('friendCompareChart'); if(!box)return;
    box.innerHTML='<div class="muted small">Loading comparison…</div>';
    const {data:rows,error}=await supa.rpc('friend_exercise_progress',{exercise_normalized:normalized});
    if(error){box.innerHTML=`<div class="muted small">${esc(error.message)}</div>`;return;}

    const latest={}; rows.forEach(r=>latest[r.user_id]=r);
    box.innerHTML=`<div class="chart-wrap">${friendComparisonChart(rows)}</div><div class="compare-legend">${Object.values(latest).map(r=>`<span>${r.user_id===currentUser.id?'You':esc(r.display_name||r.username)} · ${esc(r.personal_rank)} · ${fmtNum(r.progress_pct,1)}%</span>`).join('')}</div><div class="notice" style="margin-top:12px;">Each line starts from that person’s own first logged estimated 1RM for this exercise, so the graph compares progress rather than who lifts the most.</div>`;
  }
  function friendComparisonChart(rows){
    const groups={}; rows.forEach(r=>(groups[r.user_id]??=[]).push(r));
    const allDates=[...new Set(rows.map(r=>r.workout_date))].sort();
    const vals=rows.map(r=>Number(r.progress_pct)||0); const max=Math.max(5,...vals)*1.15;
    const W=600,H=200,pad={l:38,r:10,t:12,b:28};
    const xDate=d=>allDates.length===1?(W-pad.l-pad.r)/2+pad.l:pad.l+allDates.indexOf(d)*(W-pad.l-pad.r)/(allDates.length-1);
    const y=v=>pad.t+(max-v)*(H-pad.t-pad.b)/max;
    const palette=['#1687ff','#7a63ff','#16a078','#e58a2c','#d75f8c','#3e8d9e'];
    const grid=[0,.33,.66,1].map((f,i)=>{const v=max*(1-f),yy=y(v);return `<line class="chart-gridline" x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}"/><text class="chart-label" x="0" y="${yy+3}">${fmtNum(v,0)}%</text>`;}).join('');
    let paths='',dots=''; Object.values(groups).forEach((g,gi)=>{g.sort((a,b)=>a.workout_date.localeCompare(b.workout_date));const c=palette[gi%palette.length];const path=g.map((r,i)=>`${i?'L':'M'} ${xDate(r.workout_date).toFixed(1)} ${y(Number(r.progress_pct)||0).toFixed(1)}`).join(' ');paths+=`<path d="${path}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;dots+=g.map(r=>`<circle cx="${xDate(r.workout_date)}" cy="${y(Number(r.progress_pct)||0)}" r="4" fill="${c}" stroke="white" stroke-width="2"><title>${esc(r.display_name||r.username)}: ${fmtNum(r.progress_pct,1)}%</title></circle>`).join('');});
    const labels=[allDates[0],allDates[Math.floor((allDates.length-1)/2)],allDates.at(-1)].filter((v,i,a)=>v&&a.indexOf(v)===i);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Friend progress comparison graph">${grid}${paths}${dots}${labels.map((d,i)=>`<text class="chart-label" x="${xDate(d)}" y="${H-5}" text-anchor="${i===0?'start':i===labels.length-1?'end':'middle'}">${esc(fmtDate(d))}</text>`).join('')}</svg>`;
  }

    openModal(`<div class="modal-head"><button class="close-btn" data-close>×</button><h2>${signup?'Create account':'Sign in'}</h2><button class="text-btn" id="switchAuth">${signup?'Sign in':'Create'}</button></div><div class="modal-body auth-shell"><div class="auth-brand"><div class="logo">LL</div><h2>${signup?'Create your LiftLog':'Welcome back'}</h2><p class="muted small">${signup?'Your workouts will sync across devices after you sign in.':'Use the same account on any device to get your workouts and friends.'}</p></div>${signup?`<div class="field"><label class="label">Username</label><input id="authUsername" class="input" autocomplete="username" placeholder="e.g. oscar_lifts" maxlength="20"></div><div class="field"><label class="label">Display name</label><input id="authDisplay" class="input" autocomplete="name" placeholder="Optional" maxlength="40"></div>`:''}<div class="field"><label class="label">Email</label><input id="authEmail" type="email" class="input" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label class="label">Password</label><input id="authPassword" type="password" class="input" autocomplete="${signup?'new-password':'current-password'}" placeholder="At least 8 characters"></div><button class="primary-btn full" id="submitAuth">${signup?'Create account':'Sign in'}</button><div id="authMessage" class="tiny muted" style="margin-top:10px;text-align:center;"></div>${signup?'<div class="cloud-note" style="margin-top:14px;">New profiles are private from username search by default. You can turn discoverability on later in More.</div>':''}</div>`);
    document.getElementById('switchAuth').onclick=()=>openAuthModal(signup?'login':'signup');
    document.getElementById('submitAuth').onclick=()=>submitAuth(signup);

  async function submitAuth(signup){
    const email=document.getElementById('authEmail').value.trim(); const password=document.getElementById('authPassword').value; const msg=document.getElementById('authMessage'); const btn=document.getElementById('submitAuth');
    if(!email||password.length<8){msg.textContent='Enter a valid email and a password with at least 8 characters.';return;}
    btn.disabled=true; msg.textContent=signup?'Creating account…':'Signing in…';
    if(signup){
      const username=document.getElementById('authUsername').value.trim(); const display=document.getElementById('authDisplay').value.trim();
      if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){msg.textContent='Username must be 3–20 characters using letters, numbers or underscores.';btn.disabled=false;return;}
      const {data:available,error:ae}=await supa.rpc('is_username_available',{candidate:username});
      if(ae||!available){msg.textContent=ae?.message||'That username is already taken.';btn.disabled=false;return;}
      const {data:res,error}=await supa.auth.signUp({email,password,options:{data:{username,display_name:display},emailRedirectTo:location.origin}});
      if(error){msg.textContent=error.message;btn.disabled=false;return;}
      if(!res.session){msg.textContent='Account created. Check your email to confirm it, then return here and sign in.';btn.disabled=false;return;}
      closeModal(); showToast('Account created');
    } else {
      const {error}=await supa.auth.signInWithPassword({email,password});
      if(error){msg.textContent=error.message;btn.disabled=false;return;}
      closeModal(); showToast('Signed in');
    }
  }

  async function initAuth(){

    const {data:{session}}=await supa.auth.getSession();
    if(session?.user) await handleSignedIn(session.user);
    supa.auth.onAuthStateChange((event,session)=>{
      setTimeout(async()=>{
        if(session?.user){ if(!currentUser || currentUser.id!==session.user.id) await handleSignedIn(session.user); }
        else if(currentUser){ currentUser=null;currentProfile=null;cloudReady=false;cloudWorkoutCount=0;data=loadData();render();showToast('Signed out'); }

  async function handleSignedIn(user){
    currentUser=user; cloudReady=false;
    const {data:p}=await supa.from('profiles').select('*').eq('id',user.id).single(); currentProfile=p;
    const cloud=await fetchCloudData();
    if(cloud.exercises.length===0 && cloud.workouts.length===0){
      data={version:2,exercises:clone(starterExercises),workouts:[],createdAt:new Date().toISOString()};
      await pushSnapshotToCloud(data);
    } else data=cloud;
    cloudWorkoutCount=data.workouts.length;
    localStorage.setItem(accountStorageKey(),JSON.stringify(data));
    cloudReady=true; render();
  }
  async function fetchCloudData(){
    if(!currentUser)return {version:2,exercises:[],workouts:[]};
    const [{data:exRows,error:ee},{data:wRows,error:we}]=await Promise.all([
      supa.from('user_exercises').select('*').eq('user_id',currentUser.id).order('name'),
      supa.from('workouts').select('*').eq('user_id',currentUser.id).order('workout_date')
    ]);
    if(ee||we){showToast('Cloud sync could not load');return {version:2,exercises:[],workouts:[]};}
    let setRows=[]; const ids=(wRows||[]).map(w=>w.id); if(ids.length){const {data:srows}=await supa.from('workout_sets').select('*').in('workout_id',ids).order('set_number'); setRows=srows||[];}
    const exercises=(exRows||[]).map(e=>({id:e.id,name:e.name,muscle:e.muscle,equipment:e.equipment,custom:e.custom}));
    const workouts=(wRows||[]).map(w=>{const sets=setRows.filter(s=>s.workout_id===w.id);const grouped={};sets.forEach(s=>{(grouped[s.exercise_id]??=[]).push({weight:Number(s.weight),reps:Number(s.reps)});});return {id:w.id,date:w.workout_date,name:w.name,notes:w.notes||'',exercises:Object.entries(grouped).map(([exerciseId,sets])=>({exerciseId,sets}))};});
    return {version:2,exercises,workouts,createdAt:new Date().toISOString()};
  }
  async function syncToCloud(){
    if(!currentUser||!cloudReady)return; if(syncRunning){syncDirty=true;return;} syncRunning=true; syncDirty=false;
    const snap=clone(data); const ok=await pushSnapshotToCloud(snap); syncRunning=false;
    if(ok){cloudWorkoutCount=snap.workouts.length;} if(syncDirty) scheduleCloudSync();
  }
  async function pushSnapshotToCloud(snapshot){
    if(!currentUser)return false; const uid=currentUser.id;
    try{
      let r=await supa.from('workouts').delete().eq('user_id',uid); if(r.error)throw r.error;
      r=await supa.from('user_exercises').delete().eq('user_id',uid); if(r.error)throw r.error;
      const unique=[]; const seen=new Set(); for(const e of snapshot.exercises){const n=normalizeExerciseName(e.name);if(!n||seen.has(n))continue;seen.add(n);unique.push({user_id:uid,name:e.name,normalized_name:n,muscle:e.muscle||'Other',equipment:e.equipment||'Other',custom:!!e.custom,_local:e.id});}
      const payload=unique.map(({_local,...x})=>x); const {data:inserted,error:ie}=payload.length?await supa.from('user_exercises').insert(payload).select():{data:[],error:null}; if(ie)throw ie;
      const exMap={}; (inserted||[]).forEach(e=>exMap[e.normalized_name]=e.id);
      for(const w of snapshot.workouts){
        const {data:wr,error:werr}=await supa.from('workouts').insert({user_id:uid,workout_date:w.date,name:w.name||'Workout',notes:w.notes||''}).select().single(); if(werr)throw werr;
        const setPayload=[]; for(const entry of (w.exercises||[])){const ex=snapshot.exercises.find(x=>x.id===entry.exerciseId); if(!ex)continue; const cloudEx=exMap[normalizeExerciseName(ex.name)]; if(!cloudEx)continue; (entry.sets||[]).forEach((st,i)=>{if(Number(st.weight)>0&&Number(st.reps)>0)setPayload.push({workout_id:wr.id,exercise_id:cloudEx,set_number:i+1,weight:Number(st.weight),reps:Number(st.reps)});});}
        if(setPayload.length){const {error:se}=await supa.from('workout_sets').insert(setPayload);if(se)throw se;}
      }
      return true;
    }catch(err){console.warn('Cloud sync failed',err);syncDirty=true;showToast('Saved on device; cloud sync will retry');return false;}
  }

  function exportJSON(){
    const payload={...data,exportedAt:new Date().toISOString(),app:'LiftLog'};
    downloadFile(`liftlog-backup-${isoDate(new Date())}.json`,JSON.stringify(payload,null,2),'application/json');
  }
  function exportCSV(){
    const rows=[['date','workout','exercise','muscle','equipment','set','weight','reps']];
    [...data.workouts].sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>(w.exercises||[]).forEach(e=>{
      const ex=getExercise(e.exerciseId); (e.sets||[]).forEach((s,i)=>rows.push([w.date,w.name,ex.name,ex.muscle,ex.equipment,i+1,s.weight,s.reps]));
    }));
    const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    downloadFile(`liftlog-${isoDate(new Date())}.csv`,csv,'text/csv');
  }
  function downloadFile(name,content,type){
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
  }
  function importJSON(e){
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();reader.onload=()=>{
      try{const incoming=JSON.parse(reader.result);if(!Array.isArray(incoming.exercises)||!Array.isArray(incoming.workouts))throw new Error('Invalid backup');data={version:1,exercises:incoming.exercises,workouts:incoming.workouts,createdAt:incoming.createdAt||new Date().toISOString()};saveData();showToast('Backup imported');renderMore();}
      catch(err){alert('That file does not look like a LiftLog backup.');}
    };reader.readAsText(file);
  }

  function openWorkoutEditor(opts={}){
    let source=opts.workoutId?data.workouts.find(w=>w.id===opts.workoutId):null;
    workoutDraft=source?clone(source):{id:uid('w'),date:isoDate(new Date()),name:'Workout',notes:'',exercises:[]};
    if(opts.exerciseId && !workoutDraft.exercises.some(e=>e.exerciseId===opts.exerciseId)) workoutDraft.exercises.push({exerciseId:opts.exerciseId,sets:[{weight:'',reps:''}]});
    drawWorkoutModal();
  }
  function drawWorkoutModal(){
    openModal(`
      <div class="modal-head"><button class="close-btn" data-close>×</button><h2>${data.workouts.some(w=>w.id===workoutDraft.id)?'Edit workout':'Log workout'}</h2><button class="text-btn" id="saveWorkout">Save</button></div>
      <div class="modal-body">
        <div class="form-grid"><div class="field"><label class="label">Date</label><input class="input" id="draftDate" type="date" value="${workoutDraft.date}"></div><div class="field"><label class="label">Workout name</label><input class="input" id="draftName" value="${esc(workoutDraft.name)}" placeholder="e.g. Chest / Biceps"></div></div>
        <div id="draftExercises">${workoutDraft.exercises.map((e,i)=>setEditorCard(e,i)).join('')}</div>
        <button class="secondary-btn full" id="addExerciseToWorkout">+ Add exercise</button>
        <div class="field" style="margin-top:12px;"><label class="label">Workout notes</label><textarea class="textarea" id="draftNotes" placeholder="Optional notes">${esc(workoutDraft.notes||'')}</textarea></div>
        <div class="notice">Your previous performance appears under each exercise so you can see the last load and reps before entering today’s sets.</div>
      </div>
    `);
    wireWorkoutDraft();
  }
  function setEditorCard(entry,index){
    const ex=getExercise(entry.exerciseId);
    return `<div class="card set-editor-card" data-entry="${index}"><div class="set-editor-head"><div><h3>${esc(ex.name)}</h3><div class="tiny muted">${esc(ex.muscle)} · ${esc(ex.equipment)}</div>${previousPerformanceHTML(ex.id)}</div><button class="mini-btn remove-entry" data-i="${index}" title="Remove exercise">×</button></div>
      <div class="history-set" style="padding:0 0 3px;"><div></div><div class="tiny muted" style="text-align:center;font-weight:800;">WEIGHT</div><div class="tiny muted" style="text-align:center;font-weight:800;">REPS</div><div></div></div>
      ${(entry.sets||[]).map((s,j)=>`<div class="set-editor-row"><div class="setnum">${j+1}</div><input inputmode="decimal" data-field="weight" data-i="${index}" data-j="${j}" value="${s.weight??''}" placeholder="kg"><input inputmode="numeric" data-field="reps" data-i="${index}" data-j="${j}" value="${s.reps??''}" placeholder="reps"><button class="mini-btn remove-set" data-i="${index}" data-j="${j}">×</button></div>`).join('')}
      <button class="add-set" data-addset="${index}">+ Add set</button>
    </div>`;
  }
  function syncDraftHeader(){
    const date=document.getElementById('draftDate'),name=document.getElementById('draftName'),notes=document.getElementById('draftNotes');
    if(date) workoutDraft.date=date.value||workoutDraft.date;
    if(name) workoutDraft.name=name.value.trim()||'Workout';
    if(notes) workoutDraft.notes=notes.value;
  }
  function syncSetInputs(){
    document.querySelectorAll('#draftExercises input[data-field]').forEach(inp=>{
      const i=Number(inp.dataset.i),j=Number(inp.dataset.j); if(!workoutDraft.exercises[i]?.sets[j])return;
      const n=parseFloat(inp.value); workoutDraft.exercises[i].sets[j][inp.dataset.field]=Number.isFinite(n)?n:'';
    });
  }
  function redrawDraftExercises(){
    syncDraftHeader(); syncSetInputs();
    document.getElementById('draftExercises').innerHTML=workoutDraft.exercises.map((e,i)=>setEditorCard(e,i)).join(''); wireDraftExerciseControls();
  }
  function wireWorkoutDraft(){
    document.getElementById('saveWorkout').onclick=saveWorkoutDraft;
    document.getElementById('addExerciseToWorkout').onclick=()=>{syncDraftHeader();syncSetInputs();openExercisePicker();};
    wireDraftExerciseControls();
  }
  function wireDraftExerciseControls(){
    document.querySelectorAll('.remove-entry').forEach(b=>b.onclick=()=>{syncDraftHeader();syncSetInputs();workoutDraft.exercises.splice(Number(b.dataset.i),1);redrawDraftExercises();});
    document.querySelectorAll('.remove-set').forEach(b=>b.onclick=()=>{syncDraftHeader();syncSetInputs();const sets=workoutDraft.exercises[Number(b.dataset.i)].sets;sets.splice(Number(b.dataset.j),1);redrawDraftExercises();});
    document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{syncDraftHeader();syncSetInputs();const e=workoutDraft.exercises[Number(b.dataset.addset)];const last=e.sets.at(-1)||{};e.sets.push({weight:last.weight??'',reps:last.reps??''});redrawDraftExercises();});
  }
  function saveWorkoutDraft(){
    syncDraftHeader();syncSetInputs();
    workoutDraft.exercises=workoutDraft.exercises.map(e=>({...e,sets:(e.sets||[]).filter(s=>Number(s.weight)>0 && Number(s.reps)>0).map(s=>({weight:Number(s.weight),reps:Number(s.reps)}))})).filter(e=>e.sets.length);
    if(!workoutDraft.date){alert('Choose a date.');return;}
    if(!workoutDraft.exercises.length){alert('Add at least one completed set before saving.');return;}
    const idx=data.workouts.findIndex(w=>w.id===workoutDraft.id);
    if(idx>=0)data.workouts[idx]=clone(workoutDraft);else data.workouts.push(clone(workoutDraft));
    saveData();closeModal();showToast('Workout saved');go('workout',{workoutId:workoutDraft.id});
  }
  function openExercisePicker(){
    const currentHTML=modalRoot.innerHTML;
    // Replace sheet with picker; cancelling returns to draft.
    openModal(`<div class="modal-head"><button class="close-btn" id="backToDraft">‹</button><h2>Add exercise</h2><button class="text-btn" id="newFromPicker">New</button></div><div class="modal-body"><div class="search-wrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="pickerSearch" class="search-input" placeholder="Search exercises" autocomplete="off"></div><div class="card list" id="pickerList"></div></div>`);
    const search=document.getElementById('pickerSearch'), list=document.getElementById('pickerList');
    const draw=()=>{
      const q=search.value.toLowerCase().trim();const items=data.exercises.filter(e=>!q||`${e.name} ${e.muscle}`.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
      list.innerHTML=items.map(e=>`<div class="list-row exercise-pick-row" data-pick="${e.id}"><div class="exercise-icon">${initials(e.name)}</div><div class="list-main"><div class="list-title">${esc(e.name)}</div><div class="list-sub">${esc(e.muscle)} · ${esc(e.equipment)}</div>${previousPerformanceHTML(e.id)}</div><div class="chev">+</div></div>`).join('');
      list.querySelectorAll('[data-pick]').forEach(row=>row.onclick=()=>{const id=row.dataset.pick;if(!workoutDraft.exercises.some(e=>e.exerciseId===id))workoutDraft.exercises.push({exerciseId:id,sets:[{weight:'',reps:''}]});drawWorkoutModal();});
    };
    search.oninput=draw;draw();
    document.getElementById('backToDraft').onclick=drawWorkoutModal;
    document.getElementById('newFromPicker').onclick=()=>openAddExercise(true);
  }

  function openAddExercise(returnToPicker=false){
    openModal(`<div class="modal-head"><button class="close-btn" data-close>×</button><h2>New exercise</h2><button class="text-btn" id="saveExercise">Save</button></div><div class="modal-body"><div class="field"><label class="label">Exercise name</label><input id="newExerciseName" class="input" placeholder="e.g. Cable Row"></div><div class="form-grid"><div class="field"><label class="label">Muscle group</label><select id="newExerciseMuscle" class="select">${muscleGroups.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="field"><label class="label">Equipment</label><select id="newExerciseEquipment" class="select">${equipmentOptions.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="notice">Custom exercises behave exactly like the built-in ones: they get history, charts and PRs as soon as you log them.</div></div>`);
    document.getElementById('saveExercise').onclick=()=>{
      const name=document.getElementById('newExerciseName').value.trim();if(!name){alert('Give the exercise a name.');return;}
      const ex={id:uid('ex'),name,muscle:document.getElementById('newExerciseMuscle').value,equipment:document.getElementById('newExerciseEquipment').value,custom:true};data.exercises.push(ex);saveData();showToast('Exercise added');
      if(returnToPicker){openExercisePicker();}else{closeModal();go('exercise',{exerciseId:ex.id});}
    };
  }

  function openModal(html){ modalRoot.innerHTML=`<div class="modal-backdrop"><div class="modal">${html}</div></div>`;modalRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);modalRoot.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();}); }
  function closeModal(){ modalRoot.innerHTML=''; }

  function wireCommon(){
    view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
    view.querySelectorAll('[data-workout]').forEach(el=>el.onclick=()=>go('workout',{workoutId:el.dataset.workout}));
    view.querySelectorAll('[data-exercise]').forEach(el=>el.onclick=()=>go('exercise',{exerciseId:el.dataset.exercise}));
  }

  document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>go(b.dataset.route));
  backBtn.onclick=()=>{
    if(route.name==='exercise') go('exercises');
    else if(route.name==='workout') go('today');
    else go('today');
  };
  quickAddBtn.onclick=()=>openWorkoutEditor();

  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});

  render();
  initAuth();
})();

  </script>
</body>
</html>
